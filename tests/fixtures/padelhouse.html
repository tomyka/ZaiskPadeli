<!-- Minimal reproduction of rezervacija.padelhouse.lt timetable markup. -->
<div class="time-description"><div class="color" style="background-color:#00FF00"></div>
  <div class="description"><span class="old-price">30 €</span> 24 € / val.</div></div>
<div class="time-description"><div class="color" style="background-color:#0000ff"></div>
  <div class="description">32,50 € / val.</div></div>
<table>
  <tr><th class="sticky-colum"></th><th colspan="2">20:00</th><th colspan="2">21:00</th></tr>
  <tr>
    <th class="sticky-colum">Kortas 1</th>
    <td style="background-color:#00ff00" data-time="20:00"></td>
    <td class="not-available"></td>
    <td style="background-color:#0000FF" data-time="21:00"></td>
    <td style="background-color:#0000ff" data-time="21:30"></td>
  </tr>
</table>
<!-- mobile duplicate table must be ignored -->
<table>
  <tr><th class="sticky-colum">Kortas 2</th><td style="background-color:#00ff00"></td></tr>
</table>
