name = "padelis-proxy"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# Run near Lithuania, not at the caller's edge. Vercel (arn1) enters Cloudflare in
# Stockholm, and kaunopadelis.lt answers Worker requests from there with a
# "Just a moment..." challenge (403); from a Warsaw-area location it serves the grid.
[placement]
mode = "targeted"
region = "gcp:europe-central2"

# Pre-warm the app's availability cache (today + 2 days) every 5 minutes, matching
# the cache's 5-minute freshness window. Replaces the GitHub Actions schedule, which
# stopped firing reliably (#22).
[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_URL = "https://zaiskpadeli.lt"
# Secrets — set via `wrangler secret put <NAME>`, never committed here:
#   PROXY_TOKEN
#   KAUNOPADELIS_LOGIN
#   KAUNOPADELIS_PASSWORD
#   CRON_SECRET  (same value as the app's CRON_SECRET)
