name: Pre-warm scrape cache (manual)

# The schedule lives in the cf-proxy Worker's cron trigger (cf-proxy/wrangler.toml):
# GitHub's schedule stopped firing after 2026-10-29 and delayed runs by hours (#22).
# This workflow stays as a manual way to trigger a scrape and read the health report.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger scrape
        run: |
          status=$(curl -s -o body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://zaiskpadeli.lt/api/cron/scrape")
          echo "Response: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Scrape returned HTTP $status"
            exit 1
          fi
          # Scraper-health canary: venues whose upstream site broke (carried = still showing last good data)
          jq -r '.results | to_entries[] | "\(.key) venues=\(.value.venues) errors=\(.value.errors) ms=\(.value.ms) failed=\(.value.failed | join(",")) carried=\(.value.carried | join(","))"' body.json
          failed=$(jq -r '[.results[].failed[]] | unique | join(", ")' body.json)
          if [ -n "$failed" ]; then
            echo "::warning title=Venues failing to scrape::$failed"
          fi
