name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # The proxy Worker bundles server/utils/ntennis-fetch.ts — make sure server changes keep it bundling
      - name: Typecheck + bundle cf-proxy Worker
        working-directory: cf-proxy
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --dry-run --outdir dist
